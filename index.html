<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的年度书架</title>
<meta name="description" content="记录你的年度阅读，生成好看的书架图片">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c09;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:32px 12px;font-family:'Noto Serif SC','STSong',Georgia,serif}
.bs{background:linear-gradient(170deg,#1a1510 0%,#2a2218 40%,#1e1a14 100%);border-radius:16px;padding:40px 20px 32px;color:#e8e0d4;position:relative;overflow:hidden;max-width:780px;width:100%}
.bs::before{content:'';position:absolute;inset:0;opacity:.03;pointer-events:none;background-image:radial-gradient(circle at 20% 50%,#fff 1px,transparent 1px);background-size:24px 24px}
.hdr{text-align:center;margin-bottom:32px;position:relative}
.hdr .sub{font-size:10px;letter-spacing:6px;color:#8a7e6e;margin-bottom:8px;font-family:sans-serif}
.st{font-size:28px;font-weight:300;color:#f0ece4;letter-spacing:4px;cursor:pointer;border:none;border-bottom:1px dashed transparent;transition:border-color .2s;display:inline-block;padding:2px 4px;background:none;font-family:inherit}
.st:hover{border-bottom-color:rgba(212,197,169,.3)}
.tew{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 auto 4px;max-width:360px}
.tei{background:transparent;border:none;border-bottom:1px solid rgba(212,197,169,.4);color:#f0ece4;font-size:28px;font-weight:300;letter-spacing:4px;text-align:center;outline:none;padding:4px 8px;width:100%;font-family:'Noto Serif SC',serif}
.tec{background:none;border:1px solid rgba(212,197,169,.3);border-radius:4px;color:#d4c5a9;font-size:12px;padding:4px 12px;cursor:pointer}
.dv{width:40px;height:1px;margin:12px auto 16px;background:linear-gradient(90deg,transparent,#8a7e6e,transparent)}
.sts{display:flex;justify-content:center;gap:24px;font-size:12px;color:#8a7e6e;flex-wrap:wrap}
.sts .n{color:#d4c5a9;font-weight:600}.sts .n.b{font-size:16px}
.sr{margin-bottom:8px}
.sb{display:flex;align-items:flex-end;gap:10px;padding:0 16px;justify-content:center;flex-wrap:nowrap}
.sp{height:10px;margin:0 6px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#8B7355 0%,#6B5740 40%,#5a4a36 100%);box-shadow:0 5px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.bk{flex-shrink:0;align-self:flex-end;cursor:default;transition:transform .25s cubic-bezier(.23,1,.32,1),filter .25s ease}
.bk:hover{transform:translateY(-10px) scale(1.05);filter:brightness(1.1)}
.bi{border-radius:3px;overflow:hidden;position:relative;box-shadow:2px 4px 10px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);transition:box-shadow .25s ease}
.bk:hover .bi{box-shadow:5px 8px 20px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.bi img{width:100%;height:100%;object-fit:cover;display:block}
.bss{position:absolute;top:0;left:0;bottom:0;width:5px;background:linear-gradient(90deg,rgba(0,0,0,.3),transparent);pointer-events:none}
.pc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;position:relative;overflow:hidden}
.pc .dl{position:absolute;left:50%;transform:translateX(-50%);width:55%;height:1px}
.pc .dt{top:12px}.pc .db{bottom:12px}
.pc .pt{writing-mode:vertical-rl;text-orientation:mixed;font-size:13px;font-weight:600;letter-spacing:3px;font-family:'Noto Serif SC',serif;line-height:1.5;flex:1;display:flex;align-items:center}
.pc .pa{font-size:9px;letter-spacing:1px;font-family:'Noto Serif SC',serif;margin-top:6px}
.fs{margin-top:24px;padding:14px 16px;border-top:1px solid rgba(138,126,110,.2)}
.fs .fl{font-size:10px;letter-spacing:4px;color:#8a7e6e;margin-bottom:8px;font-family:sans-serif}
.fs .fv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#c4b89a}
.btr{margin-top:20px;text-align:center;display:flex;justify-content:center;gap:10px}
.btn{background:none;border:1px solid rgba(138,126,110,.3);color:#8a7e6e;padding:6px 20px;border-radius:20px;font-size:11px;cursor:pointer;letter-spacing:2px;font-family:sans-serif;transition:all .2s}
.btn:hover{border-color:#d4c5a9;color:#d4c5a9}.btn:disabled{opacity:.5;cursor:default}
.ep{margin-top:16px;padding:20px;background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(138,126,110,.15);display:none}
.ep.open{display:block}
.sl{font-size:10px;letter-spacing:3px;color:#8a7e6e;margin-bottom:12px;font-family:sans-serif}
.inp{padding:8px 10px;background:rgba(0,0,0,.3);border:1px solid rgba(138,126,110,.2);border-radius:6px;color:#e8e0d4;font-size:13px;outline:none}
.inp:focus{border-color:rgba(212,197,169,.4)}
.abtn{padding:8px 24px;background:rgba(212,197,169,.15);border:1px solid rgba(212,197,169,.3);border-radius:6px;color:#d4c5a9;font-size:13px;cursor:pointer;transition:background .2s}
.abtn:hover{background:rgba(212,197,169,.25)}
.bl{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.blr{border-radius:8px;background:rgba(0,0,0,.15);font-size:12px;border:1px solid transparent;transition:all .15s;cursor:grab}
.blr.dragging{border-color:rgba(212,197,169,.4);background:rgba(212,197,169,.1)}
.blr.editing{background:rgba(255,255,255,.06)}
.bls{display:flex;align-items:center;gap:8px;padding:6px 10px}
.cz{width:68px;height:96px;border-radius:4px;cursor:pointer;border:2px dashed rgba(138,126,110,.3);background:rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:all .2s;flex-shrink:0;outline:none}
.cz:focus,.cz.dg{border-color:#d4c5a9;background:rgba(212,197,169,.1)}
.cz img{width:100%;height:100%;object-fit:cover;display:block}
.cz .ho{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.cz:hover .ho{opacity:1}.cz .ho span{color:#fff;font-size:10px}
.czs{width:52px;height:73px}
.tips{margin-top:14px;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.15);font-size:11px;color:#8a7e6e;line-height:1.7}
.tips b{color:#c4b89a}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:32px;height:34px;background:rgba(0,0,0,.3);border:1px solid rgba(138,126,110,.2);border-radius:6px;color:#d4c5a9;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stp button:hover{border-color:#d4c5a9;background:rgba(212,197,169,.1)}
.stp .sv{color:#d4c5a9;font-size:18px;font-weight:600;width:24px;text-align:center}
.ab{width:22px;height:22px;background:rgba(0,0,0,.2);border:1px solid rgba(138,126,110,.2);border-radius:4px;color:#8a7e6e;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;padding:0}
.ab:hover{border-color:#d4c5a9;color:#d4c5a9}.ab:disabled{opacity:.2;cursor:default}
.sr-w{display:flex;gap:2px;cursor:pointer}.sr-w span{transition:transform .1s}
.tag{padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.25);color:#c4b89a;font-size:11px;display:flex;align-items:center;gap:6px}
.tag .tx{cursor:pointer;opacity:.5;font-size:13px;transition:opacity .15s}.tag .tx:hover{opacity:1}
.edt-btn{color:#8a7e6e;cursor:pointer;font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid rgba(138,126,110,.2);background:none;transition:all .15s}
.edt-btn:hover{border-color:#d4c5a9;color:#d4c5a9}
.rm-btn{color:#8a7e6e;cursor:pointer;font-size:16px;line-height:1;padding:0 2px;background:none;border:none;transition:color .15s}
.rm-btn:hover{color:#e74c3c}
.rc-btn{color:#8a7e6e;cursor:pointer;font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid rgba(138,126,110,.2);background:none;transition:all .15s;margin-top:14px}
.rc-btn:hover{border-color:#e67e22;color:#e67e22}
.ef{padding:8px 10px 12px 52px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;border-top:1px solid rgba(138,126,110,.1)}
.lbl{font-size:10px;color:#8a7e6e;display:block;margin-bottom:4px;font-family:sans-serif}
.lbl-s{font-size:9px;color:#8a7e6e;display:block;margin-bottom:3px;font-family:sans-serif}
.mc{width:32px;height:45px;border-radius:2px;overflow:hidden;flex-shrink:0}
.mc div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:7px;font-weight:600;letter-spacing:1px}
.mc img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="bs" id="app">
  <div id="da">
    <div class="hdr">
      <div class="sub">ANNUAL READING</div>
      <div id="td"><button class="st" id="tb"></button></div>
      <div id="tw" class="tew" style="display:none"><input class="tei" id="ti"/><button class="tec" id="tc">✓</button></div>
      <div class="dv"></div>
      <div class="sts" id="stats"></div>
    </div>
    <div id="sc"></div>
    <div class="fs" id="fss"><div class="fl">★ 年度五星</div><div class="fv" id="fsl"></div></div>
  </div>
  <div class="btr">
    <button class="btn" id="togBtn">编辑书架</button>
    <button class="btn" id="expBtn">导出图片</button>
  </div>
  <div class="ep" id="ep">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div style="flex:1 1 200px"><label class="lbl">书架标题</label><input class="inp" id="tfi" style="width:100%;font-size:14px;letter-spacing:1px" placeholder="比如：2025 年度书架"/></div>
      <div style="flex:0 0 120px"><label class="lbl">每层放几本</label><div class="stp"><button id="psm">−</button><span class="sv" id="psv">6</span><button id="psp">+</button></div></div>
    </div>
    <div style="margin-bottom:16px"><label class="lbl">书籍类型管理</label><div id="typeMgr" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div></div>
    <div class="sl">添加新书</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px">
      <div><label class="lbl">封面</label><div class="cz" id="ncz" tabindex="0"><span style="font-size:18px;opacity:.4;margin-bottom:2px">📷</span><span style="font-size:8px;color:#8a7e6e;text-align:center;line-height:1.3;padding:0 4px">粘贴/拖拽</span></div><input type="file" accept="image/*" id="nfi" style="display:none"/></div>
      <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div style="flex:1 1 120px"><label class="lbl">书名</label><input class="inp" id="nt" placeholder="书名" style="width:100%"/></div>
          <div style="flex:1 1 90px"><label class="lbl">作者</label><input class="inp" id="na" placeholder="作者" style="width:100%"/></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div><label class="lbl">类型</label><select class="inp" id="ntp"></select></div>
          <div><label class="lbl">评分</label><div id="nsr" class="sr-w"></div></div>
          <button class="abtn" id="addBtn">添加</button>
        </div>
      </div>
    </div>
    <div class="sl">已有书目 · 拖拽排序 · 点击编辑 · × 删除</div>
    <div class="bl" id="blist"></div>
    <div class="tips">💡 <b>操作提示：</b><br>· 封面：点击封面区域选图 / Ctrl+V 粘贴 / 拖拽图片<br>· 排序：拖拽书目行调整顺序，或用 ↑↓ 箭头微调<br>· 编辑：点击任意书目行或"编辑"按钮展开修改</div>
  </div>
</div>
<script>
const CL=["#2D4A3E","#8B4513","#1a1a2e","#4a1942","#c45c3a","#2c3e50","#556B2F","#34495e","#c0392b","#27ae60","#7f8c8d","#e67e22","#5c4033","#1B3F2F","#8e44ad","#16a085","#d35400","#2c2c54","#6a3d9a","#b33939"];
let T="2025 年度书架",P=6,eo=false,ncd="",nr=4,ei=null,di=null;
let types=["文学","叙事非虚构","社科"];
let B=[
  {title:"明亮的夜晚",author:"崔恩美",type:"文学",rating:5,color:"#2D4A3E",cover:""},
  {title:"饥饿的盛世",author:"张宏杰",type:"叙事非虚构",rating:4,color:"#8B4513",cover:""},
  {title:"独裁者手册",author:"梅斯基塔",type:"社科",rating:4,color:"#1a1a2e",cover:""},
  {title:"国家为什么失败",author:"阿西莫格鲁",type:"社科",rating:4,color:"#4a1942",cover:""},
  {title:"弃长安",author:"张明扬",type:"叙事非虚构",rating:4,color:"#c45c3a",cover:""},
  {title:"82年生的金智英",author:"赵南柱",type:"文学",rating:4,color:"#e8d5b7",cover:""},
  {title:"刀锋",author:"毛姆",type:"文学",rating:5,color:"#2c3e50",cover:""},
  {title:"枪炮、病菌与钢铁",author:"戴蒙德",type:"社科",rating:5,color:"#556B2F",cover:""},
  {title:"房思琪的初恋乐园",author:"林奕含",type:"文学",rating:5,color:"#f5e6d3",cover:""},
  {title:"人类简史",author:"赫拉利",type:"社科",rating:4,color:"#34495e",cover:""},
  {title:"百年孤独",author:"马尔克斯",type:"文学",rating:5,color:"#d4a574",cover:""},
  {title:"置身事内",author:"兰小欢",type:"社科",rating:4,color:"#c0392b",cover:""},
  {title:"素食者",author:"韩江",type:"文学",rating:5,color:"#27ae60",cover:""},
  {title:"看不见的城市",author:"卡尔维诺",type:"文学",rating:5,color:"#7f8c8d",cover:""},
  {title:"贫穷的本质",author:"巴纳吉",type:"社科",rating:4,color:"#e67e22",cover:""},
  {title:"长安的荔枝",author:"马伯庸",type:"叙事非虚构",rating:4,color:"#e74c3c",cover:""},
  {title:"那不勒斯四部曲",author:"费兰特",type:"文学",rating:5,color:"#5c4033",cover:""},
  {title:"小径分岔的花园",author:"博尔赫斯",type:"文学",rating:5,color:"#1B3F2F",cover:""},
];

function gtc(h){if(!h||h.length<7)return"#f0ece4";const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return(.299*r+.587*g+.114*b)/255>.55?"#2c2c2c":"#f0ece4"}
function st(n){return"⭐".repeat(n)}
function f2d(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}
function cbs(){const cw=document.getElementById("app").offsetWidth;return Math.min(88,Math.max(48,Math.floor((cw-64-10*(P-1))/P)))}

function mkStars(val,onChange,sz=14){
  const d=document.createElement("div");d.className="sr-w";d.style.fontSize=sz+"px";
  for(let n=1;n<=5;n++){const s=document.createElement("span");s.textContent="⭐";s.style.fontSize=sz+"px";
    s.style.filter=n<=val?"none":"grayscale(1) opacity(0.3)";s.style.transform=n<=val?"scale(1.1)":"scale(1)";
    if(onChange){s.style.cursor="pointer";
      s.addEventListener("mouseenter",()=>{d.querySelectorAll("span").forEach((x,j)=>{x.style.filter=j<n?"none":"grayscale(1) opacity(0.3)";x.style.transform=j<n?"scale(1.1)":"scale(1)"})});
      s.addEventListener("mouseleave",()=>{d.querySelectorAll("span").forEach((x,j)=>{x.style.filter=j<val?"none":"grayscale(1) opacity(0.3)";x.style.transform=j<val?"scale(1.1)":"scale(1)"})});
      s.addEventListener("click",()=>{val=n;onChange(n);d.querySelectorAll("span").forEach((x,j)=>{x.style.filter=j<n?"none":"grayscale(1) opacity(0.3)";x.style.transform=j<n?"scale(1.1)":"scale(1)"})});
    }d.appendChild(s)}return d}

function mkCZ(cover,onChange,title,small){
  const z=document.createElement("div");z.className="cz"+(small?" czs":"");z.tabIndex=0;z.title=`为《${title}》设封面`;
  let cur=cover;
  function u(){z.innerHTML=cur?`<img src="${cur}"><div class="ho"><span>${small?"替换":"点击替换"}</span></div>`:`<span style="font-size:${small?14:18}px;opacity:.4;margin-bottom:1px">📷</span><span style="font-size:${small?7:8}px;color:#8a7e6e;text-align:center;line-height:1.3;padding:0 2px">粘贴/拖拽</span>`}u();
  const fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.style.display="none";z.appendChild(fi);
  async function hf(f){if(!f||!f.type.startsWith("image/"))return;cur=await f2d(f);onChange(cur);u()}
  z.addEventListener("click",()=>fi.click());fi.addEventListener("change",async e=>{const f=e.target.files?.[0];if(f)await hf(f);fi.value=""});
  z.addEventListener("paste",async e=>{const it=e.clipboardData?.items;if(!it)return;for(const i of it){if(i.type.startsWith("image/")){e.preventDefault();const f=i.getAsFile();if(f)await hf(f);return}}});
  z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("dg")});z.addEventListener("dragleave",()=>z.classList.remove("dg"));
  z.addEventListener("drop",async e=>{e.preventDefault();z.classList.remove("dg");const f=e.dataTransfer.files?.[0];if(f)await hf(f)});return z}

function mkBook(b){
  const bs=cbs(),bh=Math.round(bs*1.41),tc=gtc(b.color),dm=tc==="#f0ece4"?"rgba(240,236,228,.4)":"rgba(44,44,44,.4)";
  const d=document.createElement("div");d.className="bk";d.style.width=bs+"px";d.title=`${b.title} — ${b.author}\n${st(b.rating)}`;
  const ph=`<div class="pc" style="background:linear-gradient(160deg,${b.color}ee 0%,${b.color} 60%,${b.color}bb 100%)"><div class="dl dt" style="background:linear-gradient(90deg,transparent,${tc}30,transparent)"></div><div class="pt" style="color:${tc}">${b.title}</div><div class="pa" style="color:${dm}">${b.author}</div><div class="dl db" style="background:linear-gradient(90deg,transparent,${tc}30,transparent)"></div></div>`;
  const inner=b.cover?`<img src="${b.cover}" alt="${b.title}" onerror="this.parentElement.innerHTML=this.parentElement.getAttribute('data-ph')+'<div class=bss></div>'">`  :ph;
  d.innerHTML=`<div class="bi" style="width:${bs}px;height:${bh}px" data-ph='${ph.replace(/'/g,"&#39;")}'>${inner}<div class="bss"></div></div>`;return d}

function mv(a,b){if(b<0||b>=B.length)return;const[x]=B.splice(a,1);B.splice(b,0,x);if(ei===a)ei=b;else if(ei!==null){if(a<ei&&b>=ei)ei--;else if(a>ei&&b<=ei)ei++}render()}

function renderTypes(){
  const m=document.getElementById("typeMgr");m.innerHTML="";
  types.forEach(t=>{const s=document.createElement("span");s.className="tag";s.innerHTML=`${t}<span class="tx">×</span>`;
    s.querySelector(".tx").addEventListener("click",()=>{if(B.some(b=>b.type===t)){alert(`还有书属于"${t}"类型，请先修改`);return}types=types.filter(x=>x!==t);render()});m.appendChild(s)});
  const wrap=document.createElement("div");wrap.style.cssText="display:flex;gap:4px";
  const inp=document.createElement("input");inp.className="inp";inp.style.cssText="width:80px;font-size:11px;padding:4px 8px";inp.placeholder="新类型";
  const btn=document.createElement("button");btn.style.cssText="padding:4px 10px;background:rgba(212,197,169,.15);border:1px solid rgba(212,197,169,.2);border-radius:6px;color:#d4c5a9;font-size:11px;cursor:pointer";btn.textContent="+";
  function addT(){const v=inp.value.trim();if(!v||types.includes(v))return;types.push(v);inp.value="";render()}
  btn.addEventListener("click",addT);inp.addEventListener("keydown",e=>{if(e.key==="Enter")addT()});
  wrap.appendChild(inp);wrap.appendChild(btn);m.appendChild(wrap);
  // Update type selects
  const ntp=document.getElementById("ntp");ntp.innerHTML="";types.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;ntp.appendChild(o)})
}

function renderNewStars(){const c=document.getElementById("nsr");c.innerHTML="";c.appendChild(mkStars(nr,v=>{nr=v},14))}

function render(){
  document.getElementById("tb").textContent=T;document.getElementById("tfi").value=T;document.getElementById("psv").textContent=P;
  const tc={};B.forEach(b=>{tc[b.type]=(tc[b.type]||0)+1});
  let sh=`<span>共 <span class="n b">${B.length}</span> 本</span>`;for(const[t,c]of Object.entries(tc))sh+=`<span>${t} <span class="n">${c}</span></span>`;
  document.getElementById("stats").innerHTML=sh;
  const con=document.getElementById("sc");con.innerHTML="";const bs=cbs(),bh=Math.round(bs*1.41);
  for(let i=0;i<B.length;i+=P){const ch=B.slice(i,i+P);const row=document.createElement("div");row.className="sr";
    const bd=document.createElement("div");bd.className="sb";bd.style.minHeight=(bh+20)+"px";ch.forEach(b=>bd.appendChild(mkBook(b)));
    row.appendChild(bd);const pl=document.createElement("div");pl.className="sp";row.appendChild(pl);con.appendChild(row)}
  const tr=B.filter(b=>b.rating===5),fss=document.getElementById("fss");
  if(tr.length){fss.style.display="";document.getElementById("fsl").innerHTML=tr.map(b=>`<span>《${b.title}》</span>`).join("")}else fss.style.display="none";
  renderTypes();renderNewStars();renderList();save()}

function renderList(){
  const list=document.getElementById("blist");list.innerHTML="";
  B.forEach((b,i)=>{
    const row=document.createElement("div");row.className="blr"+(di===i?" dragging":"")+(ei===i?" editing":"");row.draggable=true;
    row.addEventListener("dragstart",e=>{di=i;e.dataTransfer.effectAllowed="move";row.classList.add("dragging")});
    row.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move"});
    row.addEventListener("drop",e=>{e.preventDefault();if(di!==null&&di!==i)mv(di,i);di=null});
    row.addEventListener("dragend",()=>{di=null;render()});

    // Summary
    const sum=document.createElement("div");sum.className="bls";sum.style.cursor="grab";
    // Arrows
    const arrows=document.createElement("div");arrows.style.cssText="display:flex;flex-direction:column;gap:2px;flex-shrink:0";
    const up=document.createElement("button");up.className="ab";up.textContent="↑";up.disabled=i===0;up.addEventListener("click",e=>{e.stopPropagation();mv(i,i-1)});
    const dn=document.createElement("button");dn.className="ab";dn.textContent="↓";dn.disabled=i===B.length-1;dn.addEventListener("click",e=>{e.stopPropagation();mv(i,i+1)});
    arrows.appendChild(up);arrows.appendChild(dn);sum.appendChild(arrows);
    // Mini cover
    const mc=document.createElement("div");mc.className="mc";
    mc.style.background=b.cover?"":"linear-gradient(160deg,"+b.color+"ee,"+b.color+"bb)";
    mc.innerHTML=b.cover?`<img src="${b.cover}">`:`<div style="color:${gtc(b.color)}">${b.title.slice(0,4)}</div>`;sum.appendChild(mc);
    // Info
    const info=document.createElement("div");info.style.cssText="flex:1;min-width:0;cursor:pointer";
    info.innerHTML=`<div style="color:#c4b89a;font-weight:500;margin-bottom:1px">${b.title}</div><div style="color:#8a7e6e;font-size:11px">${b.author} · ${b.type} · ${st(b.rating)}</div>`;
    info.addEventListener("click",()=>{ei=ei===i?null:i;render()});sum.appendChild(info);
    // Actions
    const acts=document.createElement("div");acts.style.cssText="display:flex;gap:6px;flex-shrink:0;align-items:center";
    const eb=document.createElement("button");eb.className="edt-btn";eb.textContent=ei===i?"收起":"编辑";eb.addEventListener("click",e=>{e.stopPropagation();ei=ei===i?null:i;render()});acts.appendChild(eb);
    const rb=document.createElement("button");rb.className="rm-btn";rb.textContent="×";rb.addEventListener("click",e=>{e.stopPropagation();B.splice(i,1);if(ei===i)ei=null;else if(ei!==null&&ei>i)ei--;render()});acts.appendChild(rb);
    sum.appendChild(acts);row.appendChild(sum);

    // Edit form
    if(ei===i){
      const ef=document.createElement("div");ef.className="ef";
      const cz=mkCZ(b.cover,d=>{B[i].cover=d;render()},b.title,true);ef.appendChild(cz);
      const fd=document.createElement("div");fd.style.cssText="flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px";
      // Row 1
      const r1=document.createElement("div");r1.style.cssText="display:flex;gap:6px;flex-wrap:wrap";
      r1.innerHTML=`<div style="flex:1 1 100px"><label class="lbl-s">书名</label><input class="inp" style="width:100%;font-size:12px;padding:6px 8px" value="${b.title.replace(/"/g,'&quot;')}"/></div><div style="flex:1 1 80px"><label class="lbl-s">作者</label><input class="inp" style="width:100%;font-size:12px;padding:6px 8px" value="${b.author.replace(/"/g,'&quot;')}"/></div>`;
      r1.querySelectorAll("input")[0].addEventListener("input",e=>{B[i].title=e.target.value;render()});
      r1.querySelectorAll("input")[1].addEventListener("input",e=>{B[i].author=e.target.value;render()});
      fd.appendChild(r1);
      // Row 2
      const r2=document.createElement("div");r2.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:center";
      const td=document.createElement("div");td.innerHTML=`<label class="lbl-s">类型</label>`;
      const sel=document.createElement("select");sel.className="inp";sel.style.cssText="width:auto;font-size:12px;padding:6px 8px";
      types.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;if(t===b.type)o.selected=true;sel.appendChild(o)});
      sel.addEventListener("change",e=>{B[i].type=e.target.value;render()});td.appendChild(sel);r2.appendChild(td);
      const sd=document.createElement("div");sd.innerHTML=`<label class="lbl-s">评分</label>`;sd.appendChild(mkStars(b.rating,v=>{B[i].rating=v;render()},16));r2.appendChild(sd);
      if(b.cover){const rc=document.createElement("button");rc.className="rc-btn";rc.textContent="去封面";rc.addEventListener("click",()=>{B[i].cover="";render()});r2.appendChild(rc)}
      fd.appendChild(r2);ef.appendChild(fd);row.appendChild(ef)}
    list.appendChild(row)})
}

// Title
document.getElementById("tb").addEventListener("click",()=>{document.getElementById("td").style.display="none";document.getElementById("tw").style.display="flex";const ip=document.getElementById("ti");ip.value=T;ip.focus()});
function ct(){const v=document.getElementById("ti").value.trim();if(v)T=v;document.getElementById("tw").style.display="none";document.getElementById("td").style.display="";render()}
document.getElementById("tc").addEventListener("click",ct);document.getElementById("ti").addEventListener("keydown",e=>{if(e.key==="Enter")ct();if(e.key==="Escape"){document.getElementById("tw").style.display="none";document.getElementById("td").style.display=""}});
document.getElementById("tfi").addEventListener("input",e=>{T=e.target.value||T;document.getElementById("tb").textContent=T});

// Per shelf
document.getElementById("psm").addEventListener("click",()=>{P=Math.max(2,P-1);render()});
document.getElementById("psp").addEventListener("click",()=>{P=Math.min(15,P+1);render()});

// Toggle
document.getElementById("togBtn").addEventListener("click",()=>{eo=!eo;ei=null;document.getElementById("ep").classList.toggle("open",eo);document.getElementById("togBtn").textContent=eo?"收起编辑":"编辑书架"});

// Export
document.getElementById("expBtn").addEventListener("click",async()=>{const btn=document.getElementById("expBtn");btn.textContent="导出中…";btn.disabled=true;
  try{const c=await html2canvas(document.getElementById("da"),{backgroundColor:"#1a1510",scale:2,useCORS:true,logging:false});const l=document.createElement("a");l.download=T+".png";l.href=c.toDataURL("image/png");l.click()}
  catch(e){console.error(e);alert("导出失败，请尝试截图")}finally{btn.textContent="导出图片";btn.disabled=false}});

// New cover
const ncz=document.getElementById("ncz"),nfi=document.getElementById("nfi");
ncz.addEventListener("click",()=>nfi.click());
nfi.addEventListener("change",async e=>{const f=e.target.files?.[0];if(f&&f.type.startsWith("image/")){ncd=await f2d(f);ncz.innerHTML=`<img src="${ncd}"><div class="ho"><span>点击替换</span></div>`}nfi.value=""});
ncz.addEventListener("paste",async e=>{const it=e.clipboardData?.items;if(!it)return;for(const i of it){if(i.type.startsWith("image/")){e.preventDefault();const f=i.getAsFile();if(f){ncd=await f2d(f);ncz.innerHTML=`<img src="${ncd}"><div class="ho"><span>点击替换</span></div>`}return}}});
ncz.addEventListener("dragover",e=>{e.preventDefault();ncz.classList.add("dg")});ncz.addEventListener("dragleave",()=>ncz.classList.remove("dg"));
ncz.addEventListener("drop",async e=>{e.preventDefault();ncz.classList.remove("dg");const f=e.dataTransfer.files?.[0];if(f&&f.type.startsWith("image/")){ncd=await f2d(f);ncz.innerHTML=`<img src="${ncd}"><div class="ho"><span>点击替换</span></div>`}});

// Add
document.getElementById("addBtn").addEventListener("click",()=>{const t=document.getElementById("nt").value.trim();if(!t)return;
  B.push({title:t,author:document.getElementById("na").value.trim(),type:document.getElementById("ntp").value,rating:nr,color:CL[B.length%CL.length],cover:ncd});
  document.getElementById("nt").value="";document.getElementById("na").value="";nr=4;ncd="";
  ncz.innerHTML=`<span style="font-size:18px;opacity:.4;margin-bottom:2px">📷</span><span style="font-size:8px;color:#8a7e6e;text-align:center;line-height:1.3;padding:0 4px">粘贴/拖拽</span>`;render()});

function save(){try{localStorage.setItem("bs_v3",JSON.stringify({T,B,P,types}))}catch(e){}}
function load(){try{const r=localStorage.getItem("bs_v3");if(r){const d=JSON.parse(r);if(d.T)T=d.T;if(d.B?.length)B=d.B;if(d.P)P=d.P;if(d.types?.length)types=d.types}}catch(e){}}

load();render();window.addEventListener("resize",render);
</script>
</body>
</html>
